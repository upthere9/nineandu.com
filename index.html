<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Nine&U</title>
  <meta name="description" content="Nine&U develops simple and useful mobile apps.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1d1d1f;
      background: #ffffff;
      line-height: 1.6;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    header {
      margin-bottom: 64px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      letter-spacing: -1px;
    }

    .tagline {
      margin: 0;
      color: #6e6e73;
      font-size: 18px;
    }

    section {
      margin-bottom: 48px;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 22px;
    }

    .app {
      padding: 18px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .app strong {
      display: block;
      font-size: 18px;
    }

    .app span {
      color: #6e6e73;
      font-size: 14px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid #e5e5e5;
      color: #86868b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>

    <header>
      <h1>Nine&amp;U</h1>
      <p class="tagline">Simple and useful mobile apps.</p>
    </header>

    <section>
      <h2>Apps</h2>

      <div class="app">
        <strong>ShiftKing</strong>
        <span>Shift work calendar and schedule management.</span>
      </div>

      <div class="app">
        <strong>WheelU</strong>
        <span>Mobile utility app by Nine&amp;U.</span>
      </div>
    </section>

    <section>
      <h2>Links</h2>

      <div class="links">
        <a href="https://blog.9andu.com/">Blog</a>
        <a href="https://legal.shiftk.ing/">ShiftKing Privacy Policy</a>
      </div>
    </section>

    <footer>
      &copy; 2026 Nine&amp;U
    </footer>

  </main>
</body>
</html>
